name: Dictionary

# Downloads the open sources, builds the English dictionaries (US, plus UK,
# Canada and Australia respelled from it) with tools/dictgen, and commits them to
# app/src/main/assets/dictionaries/, with the benchmark data in tools/bench/data/.

on:
  workflow_dispatch:
  # Rebuild after the Names workflow commits a new list (bot pushes don't trigger workflows).
  workflow_run:
    workflows: [Names]
    types: [completed]
  push:
    branches: [main]
    paths:
      - tools/dictgen/**
      - tools/bench/*.py
      - .github/workflows/dictionary.yml

permissions:
  contents: write

concurrency:
  group: dictionary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hunspell's en_US word list is the fallback allow list when no SCOWL list is cached.
      - name: Install Hunspell word list
        run: sudo apt-get update -q && sudo apt-get install -y -q hunspell-en-us

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: tools/dictgen/cache
          key: dictgen-${{ hashFiles('tools/dictgen/sources/*.json') }}

      - name: Build dictionaries
        run: |
          # Stamp with the last change to the pipeline so unchanged inputs give identical output.
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- tools/dictgen)
          python3 tools/dictgen/make_dict.py en_US

      - name: Build benchmark data
        run: python3 tools/bench/make_bench.py --tatoeba tools/dictgen/cache/en_US/eng_sentences.tsv.bz2

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main/assets/dictionaries/ tools/bench/data/
          if git diff --cached --quiet; then
            echo "Dictionary unchanged."
          else
            git commit -m "Update dictionaries and benchmark data"
            git pull --rebase -q origin main
            git push
          fi
