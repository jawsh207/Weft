name: Emoji data

# Downloads Unicode's emoji-test.txt, builds the emoji list with
# tools/emojigen, and commits it to app/src/main/assets/emoji/.
# Run it manually to pick up a new Unicode emoji release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/emojigen/**
      - .github/workflows/emoji.yml

permissions:
  contents: write

concurrency:
  group: emoji-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build emoji list
        run: python3 tools/emojigen/build_emoji.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/emoji/
          if git diff --cached --quiet; then
            echo "Emoji list unchanged."
          else
            git commit -m "Update emoji list"
            git pull --rebase origin main
            git push
          fi
