name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Rebuild after the Dictionary workflow commits a new dictionary
  # (pushes made with GITHUB_TOKEN don't trigger workflows on their own).
  workflow_run:
    workflows: [Dictionary]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # AGP also downloads missing SDK parts itself, so a naming mismatch here isn't fatal.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee gradle-test.log
          exit ${PIPESTATUS[0]}

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-assemble.log
          exit ${PIPESTATUS[0]}

      # Surface compiler and Gradle errors as annotations on the run summary.
      - name: Report build errors
        if: failure()
        run: |
          for f in gradle-test.log gradle-assemble.log; do
            [ -f "$f" ] || continue
            grep -E "^e: |error:|What went wrong|Could not |Unresolved|expected:|FAILED|Exception|^> |Dependency |requires|compileSdk|Android Gradle plugin|issues? (was|were) found" "$f" \
              | grep -vE "^> Task [^ ]+( (UP-TO-DATE|NO-SOURCE|FROM-CACHE|SKIPPED))?$" | head -40 > "$f.errors" || true
            grep -A4 "What went wrong" "$f" | head -10 >> "$f.errors" || true
            python3 - "$f" <<'PY'
          import sys
          name = sys.argv[1]
          lines = [l.rstrip() for l in open(name + ".errors", encoding="utf-8", errors="replace")]
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D")
          for i in range(0, len(lines), 8):
              print(f"::error title={name} ({i // 8 + 1})::" + "%0A".join(esc(l) for l in lines[i:i + 8]))
          PY
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weft-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
