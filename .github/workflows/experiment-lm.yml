name: Experiment next-word models

# Compares Weft's next-word predictions with small language models of several
# sizes (see tools/lmexp/README.md). Runs only on this experiment branch and
# commits tools/lmexp/RESULTS.md back to it. Nothing here touches the app.

on:
  push:
    branches: ["experiment/neural-lm"]
    paths-ignore: ["tools/lmexp/RESULTS.md", "tools/lmexp/results/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experiment-lm
  cancel-in-progress: true

jobs:
  # The dictionary's candidates for every benchmark position, and the training text.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore downloaded sources
        uses: actions/cache@v4
        with:
          path: tools/dictgen/cache
          key: lmexp-sources-${{ hashFiles('tools/dictgen/sources/*.json') }}
          restore-keys: |
            dictgen-
            lmexp-sources-
      - name: Training text
        run: python3 tools/lmexp/prepare.py train.txt --news 300000
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Dictionary candidates for each benchmark position
        run: |
          WEFT_NEXT_WORD_DUMP="$PWD/dump.jsonl" ./gradlew --no-daemon testDebugUnitTest \
            --tests app.weft.keyboard.predict.NextWordDumpTest
          wc -l dump.jsonl dump.jsonl.words.tsv train.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lmexp-data
          path: |
            dump.jsonl
            dump.jsonl.words.tsv
            train.txt

  own:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        size: [S, M, L]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: lmexp-data
      - name: Install
        run: pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && pip install -q onnx==1.17.0 onnxruntime==1.20.1
      - name: Train and measure
        run: |
          mkdir -p results
          python3 tools/lmexp/own.py ${{ matrix.size }} train.txt dump.jsonl results/own-${{ matrix.size }}.json --minutes 120
      - uses: actions/upload-artifact@v4
        with:
          name: result-own-${{ matrix.size }}
          path: results/

  pretrained:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        model:
          - EleutherAI/pythia-14m
          - EleutherAI/pythia-70m
          - EleutherAI/pythia-160m
          - distilbert/distilgpt2
          - HuggingFaceTB/SmolLM2-135M
          - HuggingFaceTB/SmolLM2-360M
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: lmexp-data
      - name: Install
        run: |
          pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers==4.46.3 "optimum[onnxruntime]==1.23.3" onnx==1.17.0 onnxruntime==1.20.1 huggingface_hub
      - name: Measure
        run: |
          mkdir -p results
          name=$(echo "${{ matrix.model }}" | tr '/' '_')
          python3 tools/lmexp/pretrained.py "${{ matrix.model }}" dump.jsonl "results/$name.json"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ env.NAME }}
          path: results/

  report:
    needs: [own, pretrained]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: tools/lmexp/results
          merge-multiple: true
      - name: Write and commit the report
        run: |
          ls tools/lmexp/results
          python3 tools/lmexp/report.py tools/lmexp/results/*.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lmexp/RESULTS.md tools/lmexp/results
          git commit -m "Experiment results: next-word models" && git push origin HEAD:${GITHUB_REF_NAME}
